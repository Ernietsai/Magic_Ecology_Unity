behaviors:
  EcoAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048        # 較大的 batch 適合處理複雜的 44 維動作空間
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3           # 熵權重，鼓勵 AI 早期多嘗試不同的魔法動作
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true        # 對感知數據進行歸一化，這對五行濃度與頻率非常重要
      hidden_units: 512      # 增加神經元數量以應對複雜邏輯
      num_layers: 3          # 增加深度以理解「先注入、後推動」的時間關聯
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99          # 長期獎勵因子
        strength: 1.0
      # 加入好奇心機制，驅使 AI 前往未知的魔脈區域
      curiosity:
        gamma: 0.99
        strength: 0.05
        network_settings:
          hidden_units: 256
        learning_rate: 3.0e-4

    keep_checkpoints: 10
    max_steps: 10000000      # 複雜系統建議至少訓練 1000 萬步
    time_horizon: 128        # 每一段決策序列的長度
    summary_freq: 5000